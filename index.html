<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>회의록 분석 v3</title>
<style>
:root{--bg:#f5f6f4;--card:#fff;--ink:#1d2421;--muted:#5d6a64;--line:#dde3df;--accent:#1f6b52;--accent-ink:#fff;--accent-bg:#e3f1eb;--warn:#8a5a00;--warn-bg:#fdf3dc;--bad:#b42323;--bad-bg:#fbe7e7;--rec:#d23b3b;--field:#fff;--mark:#ffe58a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131715;--card:#1b201e;--ink:#e6ebe8;--muted:#9aa7a1;--line:#2e3633;--accent:#6fc9a6;--accent-ink:#0f1a15;--accent-bg:#1d3a30;--warn:#f0c46a;--warn-bg:#3a2f16;--bad:#f08a8a;--bad-bg:#3d1f1f;--rec:#ff6b6b;--field:#141816;--mark:#6b5a13}}
:root[data-theme="dark"]{--bg:#131715;--card:#1b201e;--ink:#e6ebe8;--muted:#9aa7a1;--line:#2e3633;--accent:#6fc9a6;--accent-ink:#0f1a15;--accent-bg:#1d3a30;--warn:#f0c46a;--warn-bg:#3a2f16;--bad:#f08a8a;--bad-bg:#3d1f1f;--rec:#ff6b6b;--field:#141816;--mark:#6b5a13}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);min-height:40px}
nav.tabs button[aria-current="page"]{background:var(--accent-bg);color:var(--accent);font-weight:700}
.local{margin-left:auto;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
main{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.card h2{font-size:18px;margin:0 0 12px}
.card h3{font-size:15px;margin:18px 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
[hidden]{display:none!important}
.btn{white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:34px;padding:4px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.types{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.type-btn{min-height:64px;border:2px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;padding:8px;text-align:center}
.type-btn b{display:block;font-size:20px}
.type-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg)}
.type-btn:disabled{cursor:not-allowed;opacity:.55}
@media (max-width:640px){.types{grid-template-columns:repeat(3,minmax(0,1fr))}}
.recbox{text-align:center;padding:10px 0}
.timer{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.state{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-weight:700}
.state .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.state.recording .dot{background:var(--rec);animation:blink 1s infinite}
.state.paused .dot{background:var(--warn)}
@keyframes blink{50%{opacity:.2}}
.rec-controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.rec-controls .btn{min-height:52px}
@media (max-width:520px){.rec-controls{grid-template-columns:repeat(2,minmax(0,1fr))}}
.meter{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;margin:12px auto 0;max-width:320px}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.alert{border-radius:10px;padding:10px 14px;margin:12px 0;border-left:4px solid}
.alert.err{background:var(--bad-bg);border-color:var(--bad)}
.alert.warn{background:var(--warn-bg);border-color:var(--warn)}
.alert.ok{background:var(--accent-bg);border-color:var(--accent)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.badge.ok{color:var(--accent);border-color:var(--accent)}
.badge.review{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.badge.none{color:var(--muted)}
.dialog-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dialog{background:var(--card);border-radius:16px;max-width:460px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.dialog h2{margin:0 0 12px;font-size:19px}
dl.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
dl.meta dt{color:var(--muted)}
dl.meta dd{margin:0}
.dialog .actions{display:grid;gap:8px;margin-top:18px}
.list{display:grid;gap:10px}
.mcard{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:var(--card);text-align:left;width:100%}
.mcard:hover{border-color:var(--accent)}
.mcard .t{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:26px;color:var(--accent)}
.stat span{font-size:13px;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.filters{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px;margin-bottom:12px}
@media (max-width:640px){.filters{grid-template-columns:1fr}}
input[type=text],input[type=search],select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px}
textarea{min-height:120px;resize:vertical;line-height:1.6}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.back{border:0;background:none;color:var(--accent);cursor:pointer;padding:6px 0;font-weight:600}
.sub-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sub-tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;min-height:40px}
.sub-tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent);font-weight:700}
.summary{background:var(--accent-bg);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.summary .title{font-size:18px;font-weight:800;margin:2px 0 4px}
.agenda{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.agenda .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
.imp{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.imp.high{background:var(--bad);color:#fff;border-color:var(--bad)}
.quote{border-left:3px solid var(--line);padding-left:10px;color:var(--muted);font-size:13px;margin:6px 0}
.ev{border:0;background:none;color:var(--accent);cursor:pointer;font-size:13px;padding:0;text-decoration:underline}
.decision{border:1px solid var(--accent);border-radius:10px;padding:8px 12px;margin-top:8px}
.reason{color:var(--warn);font-size:13px}
.action{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;display:grid;grid-template-columns:auto 1fr;gap:10px}
.action input[type=checkbox]{width:22px;height:22px;margin-top:2px}
.action.done .task{text-decoration:line-through;color:var(--muted)}
.unassigned{font-style:italic;color:var(--muted)}
.transcript{white-space:pre-wrap;line-height:1.8;background:var(--bg);border-radius:10px;padding:14px;max-height:480px;overflow:auto}
mark{background:var(--mark);color:inherit;border-radius:3px}
.edit-item{border:1px dashed var(--line);border-radius:12px;padding:12px;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
audio{width:100%;max-width:520px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
details.privacy{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:12px;font-size:14px}
details.privacy summary{cursor:pointer;font-weight:600}
.rename{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;margin:6px 0}
.stt-box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;background:var(--bg)}
.stt-opts{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.stt-opts label{display:grid;gap:2px}
.stt-opts .chk{display:flex;gap:6px;align-items:center;min-height:40px;font-size:14px}
@media (max-width:640px){.stt-opts{grid-template-columns:minmax(0,1fr)}}
.stt-run{padding:10px 0;font-weight:600}
.spk-box{border:1px solid var(--line);border-radius:12px;padding:4px 14px 10px;margin:12px 0}
.spk-box .rename{grid-template-columns:48px minmax(0,auto) minmax(0,1fr)}
.txt-view{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0;max-height:520px;overflow:auto;line-height:1.75;font-size:15px}
.txt-headlines{color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.tl{padding:2px 0}
.ts{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.spk{display:inline-block;font-weight:700;border-radius:6px;padding:0 6px;font-size:13px}
.spk.c0{background:#dbeafe;color:#1e40af}.spk.c1{background:#fde2e2;color:#9b1c1c}.spk.c2{background:#dcfce7;color:#166534}
.spk.c3{background:#fef3c7;color:#92400e}.spk.c4{background:#ede9fe;color:#5b21b6}.spk.c5{background:#e0f2fe;color:#075985}
details.sec{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0}
details.sec>summary{cursor:pointer;font-weight:700}
details.sec .stt-box{margin-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:var(--accent-bg);color:var(--accent);font-weight:700;border-radius:999px;padding:3px 12px;font-size:14px}
.brief-opts{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.brief-opts label{display:grid;gap:2px}
.brief-opts .chk{display:flex;gap:6px;align-items:center;min-height:40px;font-size:14px}
@media (max-width:640px){.brief-opts{grid-template-columns:minmax(0,1fr)}}
.brief{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px;background:var(--card)}
.brief>*:not(.brief-head){margin-left:16px;margin-right:16px}
.brief-head{background:var(--accent);color:#fff;padding:16px 18px}
:root[data-theme="dark"] .brief-head{color:#0f1a15}
.brief-head .small{opacity:.85}
.brief-title{font-size:22px;font-weight:800;margin:4px 0}
.brief-preface{border-left:5px solid var(--accent);background:var(--bg);padding:10px 14px;border-radius:8px;font-weight:700;margin-top:14px}
.brief-topic{border-top:1px solid var(--line);padding:12px 0}
.brief-th{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:17px}
.num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px}
.num.top{background:var(--bad);color:#fff}
.brief ul,.dlist{margin:6px 0 0;padding-left:22px}
.brief li,.dlist li{margin:3px 0}
.brief li.sub,.dlist li.sub{list-style:none;color:var(--muted);margin-left:10px}
.brief-dec{margin-top:6px;font-weight:700;color:var(--accent)}
.dl-row{margin-top:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
#print-area{display:none}
@media print{body>*:not(#print-area){display:none!important}#print-area{display:block!important;color:#000;font-size:11pt}#print-area table{border-collapse:collapse;width:100%}#print-area td,#print-area th{border:1px solid #444;padding:4px 6px;text-align:left}#print-area h1{text-align:center;font-size:18pt}#print-area h2{font-size:13pt;margin-top:18pt}.rv{color:#a15c00}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">회의록 분석 <span class="badge">v3</span></div>
  <nav class="tabs" aria-label="화면">
    <button data-tab="record" aria-current="page">녹음</button>
    <button data-tab="meetings">회의 기록</button>
    <button data-tab="dashboard">결과 대시보드</button>
    <button data-tab="settings">설정</button>
  </nav>
  <span class="local" title="모든 데이터는 이 브라우저(IndexedDB)에만 저장됩니다">이 브라우저에만 저장</span>
</div></header>
<main id="app"></main>
<div id="print-area"></div>

<script>
"use strict";
/* =========================================================================
   회의록 분석 — 단일 파일판
   - 서버 없이 브라우저에서 동작: 녹음·저장·재생·다운로드, 회의록 입력·수정,
     회의 결과(안건·결정·후속 조치) 정리와 근거 확인, 대시보드, HWPX 보고서.
   - 데이터는 이 브라우저의 IndexedDB에만 저장된다.
   - 자동 음성 전사·AI 요약은 API 키가 필요하므로 이 파일에는 넣지 않았다
     (키를 화면 코드에 넣지 않는 원칙). 서버판에서 환경 변수로 설정해 사용한다.
   - 예시·임의 데이터는 없다. 화면의 모든 내용은 사용자가 녹음·입력한 것이다.
   ========================================================================= */

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const UNASSIGNED = "미지정";
const IMPORTANCE = { high: "높음", medium: "보통", low: "낮음" };
const MAX_TXT_BYTES = 2 * 1024 * 1024;

function cleanText(s) {
  return String(s ?? "").replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f￾￿]/g, "").replace(/[\ud800-\udfff]/g, (c, i, str) => {
    // 짝이 맞는 서로게이트(이모지 등)는 유지하고 외톨이만 제거
    const code = c.charCodeAt(0);
    if (code <= 0xdbff) { const n = str.charCodeAt(i + 1); return n >= 0xdc00 && n <= 0xdfff ? c : ""; }
    const p = str.charCodeAt(i - 1); return p >= 0xd800 && p <= 0xdbff ? c : "";
  }).normalize("NFC");
}
const cleanLine = (s) => cleanText(s).replace(/\s+/g, " ").trim();
const pad = (n) => String(n).padStart(2, "0");
const hms = (sec) => { const s = Math.max(0, Math.round(sec)); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; };
const fmtDate = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtTime = (iso) => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const krDate = (d) => `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
const stamp = (iso) => { const d = new Date(iso); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`; };
const safeName = (s) => cleanLine(s).replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, "_").slice(0, 40) || "회의";
const fmtSize = (b) => b < 1024 * 1024 ? `${(b / 1024).toFixed(1)} KB` : `${(b / 1024 / 1024).toFixed(1)} MB`;

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ---------------- 저장소 (IndexedDB) ---------------- */
const DB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      let r;
      try { r = indexedDB.open("meeting-recorder-local", 1); } catch (e) { rej(e); return; }
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore("meetings", { keyPath: "id", autoIncrement: true });
        d.createObjectStore("audio");
        d.createObjectStore("settings");
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async tx(stores, mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(stores, mode); let out;
      Promise.resolve(fn(t)).then((v) => (out = v));
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error("저장이 취소되었습니다"));
    });
  },
  req: (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
  async all() { return this.tx(["meetings"], "readonly", (t) => this.req(t.objectStore("meetings").getAll())); },
  async get(id) { return this.tx(["meetings"], "readonly", (t) => this.req(t.objectStore("meetings").get(id))); },
  async put(m) { return this.tx(["meetings"], "readwrite", (t) => this.req(t.objectStore("meetings").put(m))); },
  async addWithAudio(m, blob) {
    // 회의 정보와 음성을 한 트랜잭션에 저장한다(둘 중 하나만 남지 않도록)
    return this.tx(["meetings", "audio"], "readwrite", (t) => new Promise((res) => {
      const r = t.objectStore("meetings").add(m);
      r.onsuccess = () => { t.objectStore("audio").put(blob, r.result); res(r.result); };
    }));
  },
  async audio(id) { return this.tx(["audio"], "readonly", (t) => this.req(t.objectStore("audio").get(id))); },
  async remove(id) { return this.tx(["meetings", "audio"], "readwrite", (t) => { t.objectStore("meetings").delete(id); t.objectStore("audio").delete(id); }); },
  async clearAll() { return this.tx(["meetings", "audio"], "readwrite", (t) => { t.objectStore("meetings").clear(); t.objectStore("audio").clear(); }); },
  async getSetting(k) { return this.tx(["settings"], "readonly", (t) => this.req(t.objectStore("settings").get(k))); },
  async setSetting(k, v) { return this.tx(["settings"], "readwrite", (t) => this.req(t.objectStore("settings").put(v, k))); },
};

/* ---------------- 상태 ---------------- */
const S = {
  tab: "record", detailId: null, detailTab: "result", editing: false, highlight: null,
  types: [1, 2, 3, 4, 5].map((id) => ({ id, name: `회의 종류 ${id}` })),
  dbError: null,
  filters: { type: "", status: "", q: "" },
};
const typeName = (id) => (S.types.find((t) => t.id === id) || { name: `회의 종류 ${id}` }).name;

/* ---------------- 녹음 ---------------- */
const R = {
  state: "idle", // idle | requesting | recording | paused | stopping | confirm | saving | saved | error
  typeId: null, error: null, notice: null,
  stream: null, recorder: null, chunks: [], mime: "",
  startedAt: null, elapsed: 0, runStart: 0, timerId: null,
  blob: null, endedAt: null, savedId: null, discardAsk: false,

  if (kind === "action") {
    const r = evidenceReview(m, x.evidence); if (r) reasons.push(r);
    if (norm(x.assignee) && !inTranscript(m, x.assignee)) reasons.push("담당자가 회의록에 나오지 않습니다");

async function loadMeetings() {
  try { return (await DB.all()).sort((a, b) => b.startedAt.localeCompare(a.startedAt)); }
  catch (e) { S.dbError = e?.message || String(e); return []; }
}
function applyFilters(list) {
  const f = S.filters, q = norm(f.q).toLowerCase();
  return list.filter((m) => {
    if (f.type && m.typeId !== +f.type) return false;
    if (f.status === "no-transcript" && txStatus(m) !== "없음") return false;
    if (f.status === "no-analysis" && m.analysis) return false;
    if (f.status === "review" && !(reviewCount(m) || isStale(m))) return false;
    if (q) {
      const hay = [typeName(m.typeId), m.analysis?.title, m.analysis?.summary, m.transcript?.text,
        ...(m.analysis?.agendas || []).flatMap((g) => [g.title, g.decision]), ...(m.analysis?.actions || []).map((x) => x.task)].join(" ").toLowerCase();

    }

  });
}

  merge(segs) {
    const out = [];
    for (const g of segs) {
      const p = out[out.length - 1];
      if (p && p.speaker === g.speaker && g.start - p.end < 2 && g.end - p.start < 90) { p.text += " " + g.text; p.end = g.end; }
      else out.push({ ...g });
    }
    return out;
  },
  toText(segs, speakerName) {
    return segs.map((g) => `[${hms(Math.floor(g.start))}] ${g.speaker ? speakerName(g.speaker) + ": " : ""}${g.text}`).join("\n");
  },

  async run(m, blob, opt, onProgress) {
    STT.running = true; STT.cancel = false;
    const t0 = performance.now();
    const stop = () => Object.assign(new Error("자동 전사를 중단했습니다. 회의록은 바뀌지 않았습니다."), { cancelled: true });
    try {
      onProgress({ phase: "load" });
      const key = `${opt.model}|${opt.gpu}|${opt.speakers === 1 ? 1 : "n"}`;
      if (!STT.engine || STT.engineKey !== key) { STT.engine = null; STT.engine = await STT.loadEngine(opt, onProgress); STT.engineKey = key; }
      const eng = STT.engine;
      onProgress({ phase: "decode" });
      const x = await STT.decode(blob);
      const dur = x.length / STT.SR;
      if (dur < 0.5) throw new Error("녹음이 너무 짧아 인식할 수 없습니다.");
      let rms = STT.frameRms(x);
      const lv = STT.levels(rms);
      const diag = { audioSec: Math.round(dur * 10) / 10, noiseDb: lv.noiseDb, loudDb: lv.loudDb, thrDb: lv.thrDb };
      if (lv.loud < 0.0005) throw Object.assign(new Error(`녹음에 소리가 거의 없습니다(가장 큰 구간 ${lv.loudDb}dBFS). 마이크가 꺼져 있었거나 다른 장치가 선택되었을 수 있습니다.`), { diag });
      diag.gain = Math.round(STT.normalize(x, lv.loud) * 10) / 10;
      rms = STT.frameRms(x); const thr = lv.thr * diag.gain;
      const wins = STT.splitWindows(x.length, rms);
      diag.windows = wins.length; diag.skippedWindows = 0;
      let segs = [];
      for (let i = 0; i < wins.length; i++) {
        if (STT.cancel) throw stop();
        const w = wins[i], off = w.start / STT.SR, wl = (w.end - w.start) / STT.SR;
        onProgress({ phase: "asr", done: i, total: wins.length, audioSec: dur, elapsed: (performance.now() - t0) / 1000 });
        if (STT.speechFraction(rms, Math.floor(w.start / STT.SR / 0.02), Math.ceil(w.end / STT.SR / 0.02), thr) < 0.01) { diag.skippedWindows++; continue; }
        const part = await eng.asr(x.subarray(w.start, w.end));
        for (const c of part) segs.push({ start: off + Math.max(0, c.start), end: off + Math.min(c.end ?? wl, wl), text: c.text });
      }
      diag.rawSegments = segs.length;
      segs = STT.cleanSegments(segs, rms, thr, diag);
      diag.device = eng.device; diag.dtype = eng.dtype; diag.fellBack = !!eng.fellBack;
      if (!segs.length) throw Object.assign(new Error("녹음에서 말소리를 받아쓰지 못했습니다. 아래 진단 정보를 확인하세요."), { diag });
      let nSpk = 1;
      if (opt.speakers !== 1 && segs.length > 1) {
        const vecs = [];
        for (let i = 0; i < segs.length; i++) {
          if (STT.cancel) throw stop();
          onProgress({ phase: "spk", done: i, total: segs.length });
          vecs.push(await eng.embed(STT.clipFor(x, segs[i].start, segs[i].end)));
        }
        const lab = STT.cluster(vecs, opt.speakers || null);
        segs.forEach((g, i) => (g.speaker = lab[i]));
        nSpk = Math.max(...lab);
      } else segs.forEach((g) => (g.speaker = 1));
      const merged = STT.merge(segs);
      return { segments: merged, speakers: nSpk, device: eng.device, model: eng.model, seconds: (performance.now() - t0) / 1000, audioSec: dur, diag };
    } finally { STT.running = false; }
  },
};

/* 회의록 줄에서 화자 이름 찾기: "[00:00:05] 화자 1: 내용" 또는 "화자 1: 내용" */
const SPEAKER_LINE = /^(\[\d{2}:\d{2}:\d{2}\]\s*)?([^:\[\]\n]{1,20}):\s/;
function speakersInText(text) {
  const c = new Map();
  for (const line of cleanText(text).split("\n")) { const mm = line.match(SPEAKER_LINE); if (mm) { const n = mm[2].trim(); c.set(n, (c.get(n) || 0) + 1); } }
  return [...c.entries()].map(([name, count]) => ({ name, count }));
}
function renameSpeaker(text, from, to) {
  return text.split("\n").map((line) => { const mm = line.match(SPEAKER_LINE); return mm && mm[2].trim() === from ? (mm[1] || "") + to + ": " + line.slice(mm[0].length) : line; }).join("\n");
}
function transcriptMethod(t) {
  if (!t || t.source !== "auto") return "직접 입력";
  return `자동 음성 인식 (이 PC에서 처리, ${t.model || "Whisper"})${t.speakers > 1 ? " · 화자 자동 구분" : ""}${t.autoHash && t.autoHash !== hashText(t.text) ? " · 사용자 수정" : ""}`;
}
function txtFile(m) {
  const t = m.transcript, s = new Date(m.startedAt);
  const sp = speakersInText(t.text);
  const head = [
    `[${cleanLine(typeName(m.typeId))}] 회의록`,
    `일시: ${krDate(s)} ${fmtTime(m.startedAt)} – ${fmtTime(m.endedAt)}`,
    `녹음 시간: ${hms(m.durationSec)}`,
    m.analysis?.title ? `회의 제목: ${cleanLine(m.analysis.title)}` : null,
    sp.length ? `발언자: ${sp.map((x) => `${x.name}(${x.count}회)`).join(", ")}` : null,
    `작성: ${transcriptMethod(t)}`,
    t.source === "auto" ? "※ 자동 인식 결과입니다. 받아쓰기·화자 구분에 오류가 있을 수 있으니 녹음과 대조하세요. ‘화자 N’은 목소리로 나눈 번호이며 실제 이름이 아닙니다." : null,
    "─".repeat(30), "",
  ].filter((x) => x !== null);
  return head.join("\r\n") + cleanText(t.text).replace(/\r?\n/g, "\r\n") + "\r\n";
}

function sttOpts() {
  let o = { model: "small", speakers: 0, gpu: true };
  try { Object.assign(o, JSON.parse(localStorage.getItem("mr-stt") || "{}")); } catch { }
  if (!STT.MODELS[o.model]) o.model = "small";
  return o;
}
function saveSttOpts(o) { try { localStorage.setItem("mr-stt", JSON.stringify(o)); } catch { } }
const mb = (b) => (b / 1024 / 1024).toFixed(0);
function sttProgressText(p) {
  if (p.phase === "load") return "모델 준비 중… (처음에는 모델 파일을 내려받습니다)";
  if (p.phase === "download") return `모델 내려받는 중 ${mb(p.loaded)} / ${mb(p.total)} MB — 처음 한 번만 받습니다`;
  if (p.phase === "decode") return "녹음 파일 해독 중…";
  if (p.phase === "asr") {
    let eta = "";
    if (p.done > 0) { const left = p.elapsed / p.done * (p.total - p.done); eta = ` · 남은 시간 약 ${left < 60 ? Math.ceil(left) + "초" : Math.ceil(left / 60) + "분"}`; }
    return `음성 인식 중 ${p.done + 1} / ${p.total} 구간 (녹음 ${hms(p.audioSec)}) · 경과 ${hms(p.elapsed)}${eta}`;
  }
  if (p.phase === "spk") return `목소리로 화자 구분 중 ${p.done + 1} / ${p.total}`;
  return "";
}
function sttPct(p) {
  if (p.phase === "download" && p.total) return 5 + 25 * p.loaded / p.total;
  if (p.phase === "decode") return 32;
  if (p.phase === "asr") return 35 + 50 * p.done / Math.max(1, p.total);
  if (p.phase === "spk") return 85 + 14 * p.done / Math.max(1, p.total);
  return 3;
}

async function startStt(m) {
  if (STT.running) return;
  const o = sttOpts();
  const blob = await DB.audio(m.id).catch(() => null);
  if (!blob) { STT.last = { id: m.id, error: "이 회의의 녹음 파일을 찾을 수 없습니다." }; render(); return; }
  STT.last = { id: m.id, p: { phase: "load" } };
  const upd = (p) => {
    STT.last = { id: m.id, p };
    const el = $("#stt-status"); if (el) el.innerHTML = `<div class="stt-run"><span>${esc(sttProgressText(p))}</span></div>`;
    const b = $("#stt-bar i"); if (b) b.style.width = sttPct(p) + "%";
  };
  STT.running = true; render(); upd({ phase: "load" });
  try {
    const r = await STT.run(m, blob, o, upd);
    const text = STT.toText(r.segments, (n) => `화자 ${n}`);
    const fresh = await DB.get(m.id);
    if (!fresh) throw new Error("작업 중 회의가 삭제되었습니다.");
    const now = new Date().toISOString();
    fresh.transcript = { text, editedAt: now, source: "auto", model: r.model.split("/").pop(), device: r.device, speakers: r.speakers, autoHash: hashText(text), autoAt: now, diag: r.diag };
    await DB.put(fresh);
    STT.last = { id: m.id, done: `자동 전사를 마쳤습니다: ${r.segments.length}개 발언, 화자 ${r.speakers}명, 녹음 ${hms(r.audioSec)}을 ${hms(r.seconds)}에 처리(${r.device === "webgpu" ? "그래픽 가속" : "CPU"}). 녹음과 대조해 확인하세요.` };
    toast("자동 전사를 마쳤습니다.");
  } catch (e) {
    STT.last = { id: m.id, error: e.message || String(e), cancelled: !!e.cancelled, diag: e.diag || null };
  }
  STT.running = false;
  if (S.tab === "meetings" && S.detailId === m.id && !S.editing) render();
}

const SPK_COLORS = 6;
function txtPreviewHtml(m) {
  const lines = txtFile(m).replace(/\r/g, "").replace(/\n$/, "").split("\n");
  const sep = lines.findIndex((l) => /^─+$/.test(l));
  const head = sep >= 0 ? lines.slice(0, sep) : [], body = sep >= 0 ? lines.slice(sep + 1) : lines;
  const order = speakersInText(m.transcript.text).map((x) => x.name);
  const row = (line) => {
    const mm = line.match(SPEAKER_LINE);
    if (!mm) return `<div class="tl">${esc(line) || "&nbsp;"}</div>`;
    const i = Math.max(0, order.indexOf(mm[2].trim())) % SPK_COLORS;
    return `<div class="tl">${mm[1] ? `<span class="ts">${esc(mm[1].trim())}</span> ` : ""}<span class="spk c${i}">${esc(mm[2].trim())}</span> ${esc(line.slice(mm[0].length))}</div>`;
  };
  return `<div class="txt-view" data-testid="txt-view"><div class="txt-headlines">${head.map((l) => `<div>${esc(l)}</div>`).join("")}</div>${body.map(row).join("")}</div>`;
}
function diagHtml(d, open) {
  if (!d) return "";
  const tips = [];
  if (d.loudDb != null && d.loudDb < -35) tips.push("녹음 음량이 작습니다. 마이크를 말하는 사람 가까이 두거나 외장 마이크를 쓰면 인식이 좋아집니다.");
  if (d.windows && d.skippedWindows / d.windows > 0.5) tips.push("구간의 절반 이상을 무음으로 판단해 건너뛰었습니다. 실제로 말한 구간이 빠졌다면 알려 주세요.");
  if (d.droppedSilent > 2) tips.push("소리가 거의 없는 곳에서 나온 문장을 걸러냈습니다(Whisper가 무음에서 지어내는 문장 방지).");
  if (d.fellBack) tips.push("그래픽 가속 결과가 깨져 CPU로 다시 인식했습니다.");
  const dt = d.dtype ? Object.entries(d.dtype).map(([k, v]) => `${k.replace("_model", "").replace("_merged", "")} ${v}`).join(", ") : "";
  return `<details class="privacy" ${open ? "open" : ""} data-testid="diag"><summary>자동 전사 진단 정보</summary><dl class="meta small" style="margin-top:6px">
    <dt>녹음 길이</dt><dd>${hms(d.audioSec || 0)}</dd>
    <dt>음량</dt><dd>큰 소리 ${d.loudDb} dBFS · 잡음 ${d.noiseDb} dBFS${d.gain > 1 ? ` · 인식 전 ${d.gain}배 키움` : ""}</dd>
    <dt>무음 기준</dt><dd>${d.thrDb} dBFS (이 녹음의 잡음 수준에 맞춤)</dd>
    ${d.windows != null ? `<dt>인식 구간</dt><dd>${d.windows}개 중 무음으로 건너뜀 ${d.skippedWindows}개</dd>` : ""}
    ${d.rawSegments != null ? `<dt>받아쓴 문장</dt><dd>${d.rawSegments}개 → 걸러냄: 무음 ${d.droppedSilent || 0}, 반복 ${d.droppedRepeat || 0}, 빈 문장 ${d.droppedEmpty || 0}</dd>` : ""}
    ${d.device ? `<dt>처리 장치</dt><dd>${d.device === "webgpu" ? "그래픽 가속(WebGPU)" : "CPU(WASM)"}${dt ? ` · ${esc(dt)}` : ""}</dd>` : ""}
  </dl>${tips.length ? `<ul class="small">${tips.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}</details>`;
}
function sttBoxHtml(o, runningHere, mine) {
  return `<div class="stt-box">
      <div class="stt-opts">
        <label><span class="small muted">정확도</span><select id="stt-model" ${STT.running ? "disabled" : ""}>${Object.entries(STT.MODELS).map(([k, v]) => `<option value="${k}" ${o.model === k ? "selected" : ""}>${esc(v.label)}</option>`).join("")}</select></label>
        <label><span class="small muted">참석자 수</span><select id="stt-spk" ${STT.running ? "disabled" : ""}>
          <option value="0" ${!o.speakers ? "selected" : ""}>자동으로 추정</option>
          <option value="1" ${o.speakers === 1 ? "selected" : ""}>1명 (화자 구분 안 함)</option>
          ${[2, 3, 4, 5, 6, 7, 8].map((n) => `<option value="${n}" ${o.speakers === n ? "selected" : ""}>${n}명</option>`).join("")}</select></label>
        <label class="chk"><input type="checkbox" id="stt-gpu" ${o.gpu ? "checked" : ""} ${STT.running ? "disabled" : ""}> 그래픽 가속(WebGPU) 사용</label>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="stt-start" ${STT.running ? "disabled" : ""}>자동 전사 시작</button>
        <button class="btn" id="stt-cancel" ${runningHere ? "" : "hidden"}>중단</button>
      </div>
      <div id="stt-confirm"></div>
      <details class="privacy"><summary>자동 전사 안내</summary><ul class="small">
        <li><b>음성은 외부로 전송되지 않습니다.</b> 이 브라우저 안에서 음성 인식(Whisper)과 화자 구분(WavLM)을 실행합니다.</li>
        <li>처음 한 번 모델 파일(수백 MB, ‘가장 정확’은 1GB 이상)을 인터넷(huggingface.co, cdn.jsdelivr.net)에서 내려받습니다. https 주소(예: GitHub Pages)에서 열면 브라우저에 저장되어 다음부터 다시 받지 않습니다.</li>
        <li>받아쓰기가 부정확하면 정확도를 한 단계 올려 보세요. 그래픽 가속이 되는 PC라면 ‘가장 정확’을 권장합니다.</li>
        <li>‘화자 1, 화자 2’는 목소리가 비슷한 구간끼리 묶은 번호이며 실제 이름이 아닙니다. 참석자 수를 알면 직접 고르는 편이 정확합니다.</li>
        <li>처리 중에는 이 창을 닫지 마세요. 그래픽 가속이 안 되는 PC에서는 녹음 시간보다 오래 걸릴 수 있습니다.</li></ul></details>
    </div>`;
}

function renderTranscriptCard(el, m) {
  const t = m.transcript && norm(m.transcript.text) ? m.transcript : null, o = sttOpts();
  const mine = STT.last && STT.last.id === m.id ? STT.last : null;
  const runningHere = !!(STT.running && mine && mine.p);
  const sp = t ? speakersInText(t.text) : [];
  const status = runningHere ? `<div class="stt-run"><span>${esc(sttProgressText(mine.p))}</span></div>`
    : STT.running ? `<div class="alert warn">다른 회의의 자동 전사가 진행 중입니다. 끝난 뒤 시작하세요.</div>`
    : mine?.error ? `<div class="alert ${mine.cancelled ? "warn" : "err"}" role="alert">${esc(mine.error)}</div>`
    : mine?.done ? `<div class="alert ok">${esc(mine.done)}</div>` : "";
  const editOpen = !t || t.source !== "auto";
  el.innerHTML = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">회의록 · 자동 전사</h2>
      ${t ? `<span class="small muted" data-testid="tx-method">${esc(transcriptMethod(t))} · 마지막 저장 ${fmtDate(t.editedAt)} ${fmtTime(t.editedAt)}</span>` : ""}</div>
    <div class="meter" id="stt-bar" ${runningHere ? "" : "hidden"} style="max-width:none;margin:12px 0 0"><i style="width:${runningHere ? sttPct(mine.p) : 0}%"></i></div>
    <div id="stt-status" aria-live="polite">${status}</div>
    ${mine?.diag && !runningHere ? diagHtml(mine.diag, true) : ""}
    ${t ? `
      <div class="row" style="justify-content:space-between;margin-top:12px"><h3 style="margin:0">회의록 텍스트 (.txt 미리보기)</h3>
        <div class="row"><button class="btn primary small" id="tx-down">회의록 텍스트(.txt) 내려받기</button><button class="btn small" id="tx-edit-open">고치기</button></div></div>
      ${txtPreviewHtml(m)}
      ${sp.length ? `<div class="spk-box"><h3>화자 이름 바꾸기</h3><p class="small muted">‘화자 1’ 같은 이름을 회의록 전체에서 한꺼번에 바꾸고 바로 저장합니다. 녹음을 들어 확인한 이름만 넣으세요.</p>
        ${sp.map((x, i) => `<div class="rename"><span class="small">${x.count}회</span><span class="spk c${i % SPK_COLORS}">${esc(x.name)}</span><span class="row" style="flex-wrap:nowrap"><input type="text" maxlength="20" data-spk="${i}" placeholder="새 이름" aria-label="${esc(x.name)}의 새 이름"><button class="btn small" data-spk-apply="${i}">바꾸기</button></span></div>`).join("")}
        <div id="spk-msg"></div></div>` : ""}
      ${t.diag && !mine?.diag ? diagHtml(t.diag, false) : ""}` : `<p class="muted" style="margin-top:12px">아직 회의록이 없습니다. 아래 ‘자동 전사 시작’으로 녹음을 글자로 바꾸거나 직접 입력하세요.</p>`}
    ${t ? `<details class="sec" id="stt-more" ${runningHere ? "open" : ""}><summary>자동 전사 ${t.source === "auto" ? "다시 하기" : "하기"} (화자 구분)</summary>${sttBoxHtml(o, runningHere, mine)}</details>` : sttBoxHtml(o, runningHere, mine)}
    <details class="sec" id="edit-box" ${editOpen ? "open" : ""}><summary>회의록 직접 고치기·입력</summary>
      <p class="small muted">형식: <code>[시:분:초] 화자: 발언</code> (시각·화자는 없어도 됩니다)</p>
      <textarea id="tx-text" aria-label="회의록" placeholder="자동 전사를 실행하거나 직접 입력하세요" style="min-height:240px">${esc(t?.text || "")}</textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn primary" id="tx-save">회의록 저장</button>
        <label class="btn" style="cursor:pointer">.txt 불러오기<input type="file" id="tx-file" accept=".txt,text/plain" hidden></label>
        <span class="small muted" id="tx-count"></span>
      </div><div id="tx-msg"></div>
    </details>`;

  const ta = $("#tx-text", el), cnt = $("#tx-count", el);
  const upd = () => (cnt.textContent = `${ta.value.length.toLocaleString()}자`); upd(); ta.oninput = upd;
  const optSync = () => saveSttOpts({ model: $("#stt-model", el).value, speakers: +$("#stt-spk", el).value, gpu: $("#stt-gpu", el).checked });
  ["#stt-model", "#stt-spk", "#stt-gpu"].forEach((id) => ($(id, el).onchange = optSync));
  $("#stt-cancel", el).onclick = () => { STT.cancel = true; const s = $("#stt-status"); if (s) s.innerHTML = `<div class="alert warn">지금 처리 중인 구간을 마치면 멈춥니다…</div>`; };
  $("#stt-start", el).onclick = () => {
    if (STT.running) return;
    const dirty = cleanText(ta.value) !== cleanText(t?.text || "");
    if (t || dirty) {
      $("#stt-confirm", el).innerHTML = `<div class="alert warn">자동 전사가 끝나면 지금 회의록${dirty ? "(저장하지 않은 수정 포함)" : ""}을 자동 전사 결과로 바꿉니다. 필요하면 먼저 ‘회의록 텍스트(.txt) 내려받기’로 보관하세요.
        <div class="row" style="margin-top:8px"><button class="btn primary" id="stt-go">계속</button><button class="btn" id="stt-no">취소</button></div></div>`;
      $("#stt-go", el).onclick = () => { $("#stt-confirm", el).innerHTML = ""; startStt(m); };
      $("#stt-no", el).onclick = () => ($("#stt-confirm", el).innerHTML = "");
    } else startStt(m);
  };
  const eo = $("#tx-edit-open", el); if (eo) eo.onclick = () => { const d = $("#edit-box", el); d.open = true; d.scrollIntoView({ block: "start" }); ta.focus(); };
  const td = $("#tx-down", el); if (td) td.onclick = () => downloadBlob(new Blob(["﻿" + txtFile(m)], { type: "text/plain;charset=utf-8" }), `${safeName(typeName(m.typeId))}_${stamp(m.startedAt)}_회의록.txt`);
  el.querySelectorAll("[data-spk-apply]").forEach((b) => b.onclick = async () => {
    const i = +b.dataset.spkApply, from = sp[i].name, to = cleanLine(el.querySelector(`[data-spk="${i}"]`).value).replace(/[:\[\]]/g, "");
    const msg = $("#spk-msg", el);
    if (!to) { msg.innerHTML = `<div class="alert err">새 이름을 입력하세요.</div>`; return; }
    if (to === from) return;
    const key = `${from}>${to}`;
    if (sp.some((x) => x.name === to) && el.dataset.mergeOk !== key) {
      el.dataset.mergeOk = key;
      msg.innerHTML = `<div class="alert warn">‘${esc(to)}’은(는) 이미 있는 화자입니다. 바꾸면 ‘${esc(from)}’의 발언이 ‘${esc(to)}’에 합쳐집니다. 맞으면 ‘바꾸기’를 한 번 더 누르세요.</div>`;
      return;
    }
    el.dataset.mergeOk = "";
    m.transcript = { ...m.transcript, text: renameSpeaker(m.transcript.text, from, to), editedAt: new Date().toISOString() };
    try { await DB.put(m); toast(`‘${from}’을(를) ‘${to}’(으)로 바꿨습니다.`); render(); }
    catch (e) { msg.innerHTML = `<div class="alert err">저장하지 못했습니다: ${esc(e.message || e)}</div>`; }
  });
  $("#tx-save", el).onclick = async () => {
    const text = cleanText(ta.value);
    if (!norm(text)) { $("#tx-msg", el).innerHTML = `<div class="alert err">회의록이 비어 있습니다.</div>`; return; }
    m.transcript = { ...(m.transcript || {}), text, editedAt: new Date().toISOString() };
    try { await DB.put(m); toast("회의록을 저장했습니다."); render(); }
    catch (e) { $("#tx-msg", el).innerHTML = `<div class="alert err">저장하지 못했습니다: ${esc(e.message || e)}</div>`; }
  };
  $("#tx-file", el).onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const msg = $("#tx-msg", el);
    if (!/\.txt$/i.test(f.name)) { msg.innerHTML = `<div class="alert err">.txt 파일만 불러올 수 있습니다.</div>`; return; }
    if (f.size > MAX_TXT_BYTES) { msg.innerHTML = `<div class="alert err">파일이 너무 큽니다(최대 2MB).</div>`; return; }
    let text = await f.text();
    if (text.includes("�")) { try { text = new TextDecoder("euc-kr").decode(await f.arrayBuffer()); } catch { } }
    ta.value = cleanText(text.replace(/^﻿/, "")); upd(); msg.innerHTML = `<div class="alert warn">불러왔습니다. 내용을 확인한 뒤 ‘회의록 저장’을 누르세요.</div>`;
  };
}

/* ---- 회의 결과 ---- */
function renderResultCard(el, m) {
  const hasTx = !!(m.transcript && norm(m.transcript.text));
  const a = m.analysis;
  if (S.editing) return renderEditor(el, m);
  const head = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">회의 결과</h2>
    <div class="row"><button class="btn small primary" id="r-auto" ${hasTx ? "" : "disabled"}>${a ? "다시 자동 정리" : "자동 정리"}</button><button class="btn small" id="r-edit" ${hasTx ? "" : "disabled"}>${a ? "수정" : "직접 정리"}</button></div></div><div id="r-confirm"></div>`;
  if (!hasTx) { el.innerHTML = head + `<div class="empty">회의록을 먼저 입력하세요. 결과는 회의록을 근거로 정리합니다.</div>`; return; }
  const tabs = `<div class="sub-tabs" role="tablist"><button role="tab" data-st="result" aria-selected="${S.detailTab === "result"}">회의 결과</button><button role="tab" data-st="full" aria-selected="${S.detailTab === "full"}">전문 보기</button></div>`;
  let body = "";
  if (S.detailTab === "full") body = transcriptHtml(m);
  else if (!a) body = `<div class="empty">아직 정리된 결과가 없습니다. ‘자동 정리’로 회의록에서 핵심어·안건·결정·후속 조치를 뽑거나 ‘직접 정리’하세요.<br><span class="small">근거 문장을 회의록에서 찾지 못한 항목은 ‘확인 필요’로 표시됩니다.</span></div>`;
  else body = resultHtml(m);
  el.innerHTML = head + tabs + body;
  $("#r-edit", el).onclick = () => { S.editing = true; render(); };
  $("#r-auto", el).onclick = () => {
    const go = async () => { try { await autoSummarize(m, (() => { let v = { topics: 0, concise: true }; try { Object.assign(v, JSON.parse(localStorage.getItem("mr-sum") || "{}")); } catch { } return { topics: v.topics || null, concise: v.concise }; })()); S.detailTab = "result"; toast("회의 결과를 자동 정리했습니다."); render(); } catch (e) { $("#r-confirm", el).innerHTML = `<div class="alert err">${esc(e.message || e)}</div>`; } };
    const edited = a && (a.source !== "auto" || (a.autoHash && a.autoHash !== analysisHash(a)));
    if (!edited) return go();
    $("#r-confirm", el).innerHTML = `<div class="alert warn">${a.source !== "auto" ? "직접 작성한" : "고친"} 회의 결과가 있습니다. 다시 자동 정리하면 그 내용이 바뀝니다.<div class="row" style="margin-top:8px"><button class="btn primary" id="r-go">다시 정리</button><button class="btn" id="r-no">취소</button></div></div>`;
    $("#r-go", el).onclick = go; $("#r-no", el).onclick = () => ($("#r-confirm", el).innerHTML = "");
  };
  el.querySelectorAll("[data-st]").forEach((b) => b.onclick = () => { S.detailTab = b.dataset.st; if (b.dataset.st === "result") S.highlight = null; renderResultCard(el, m); });
  el.querySelectorAll("[data-ev]").forEach((b) => b.onclick = () => { S.highlight = b.dataset.ev; S.detailTab = "full"; renderResultCard(el, m); setTimeout(() => el.querySelector("mark")?.scrollIntoView({ block: "center" }), 0); });
  el.querySelectorAll("[data-done]").forEach((c) => c.onchange = async () => { m.analysis.actions[+c.dataset.done].done = c.checked; await DB.put(m); renderResultCard(el, m); });
  el.querySelectorAll("[data-confirm]").forEach((b) => b.onclick = async () => {
    const [k, i] = b.dataset.confirm.split(":");
    if (k === "agenda") m.analysis.agendas[+i].confirmed = true;
    if (k === "decision") m.analysis.agendas[+i].decisionConfirmed = true;
    if (k === "action") m.analysis.actions[+i].confirmed = true;
    await DB.put(m); renderResultCard(el, m);
  });
}
function transcriptHtml(m) {
  const text = cleanText(m.transcript.text);
  let html = esc(text);
  if (S.highlight) {
    const q = norm(S.highlight);
    // 공백 차이를 허용해 찾는다
    const pattern = q.split(" ").map((w) => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("\\s+");
    try { html = html.replace(new RegExp(pattern), (s) => `<mark>${s}</mark>`); } catch { }
  }
  return `${S.highlight ? `<p class="small muted">강조한 부분이 근거 문장입니다.</p>` : ""}<div class="transcript" data-testid="full-text">${html}</div>`;
}
function evHtml(m, quote) {
  if (!norm(quote)) return "";
  const found = inTranscript(m, quote);
  return `<div class="quote">“${esc(cleanLine(quote))}”</div>${found ? `<button class="ev" data-ev="${esc(quote)}">근거 보기</button>` : ""}`;
}
function reviewHtml(m, kind, x, idx) {
  const r = reviewOf(m, kind, x);
  return r ? `<span class="badge review">확인 필요</span> <span class="reason">${esc(r)}</span> <button class="btn small" data-confirm="${kind}:${idx}">원문 확인했어요</button>` : "";
}
function resultHtml(m) {
  const a = m.analysis, rc = reviewCount(m);
  const decisions = a.agendas.map((g, i) => ({ g, i })).filter(({ g }) => norm(g.decision));
  return `
  <div class="summary">
    <div class="small muted">${esc(typeName(m.typeId))} · ${fmtDate(m.startedAt)} ${fmtTime(m.startedAt).slice(0, 5)} · 녹음 ${hms(m.durationSec)}</div>
    <div class="title" data-testid="r-title">${esc(cleanLine(a.title) || "제목 없음")}</div>
    <div>${esc(cleanText(a.summary) || "요약 없음")}</div>
    ${(a.keywords || []).length ? `<div class="chips" style="margin:6px 0">${a.keywords.slice(0, 8).map((k) => `<span class="chip">#${esc(k.replace(/\s/g, ""))}</span>`).join("")}</div>` : ""}
    <div class="small muted">${esc(analysisMethod(a))} · ${fmtDate(a.updatedAt)} ${fmtTime(a.updatedAt).slice(0, 5)}</div>
  </div>
  ${isStale(m) ? `<div class="alert warn">결과를 정리한 뒤 회의록이 수정되었습니다. 결과가 현재 회의록과 맞는지 확인하세요.</div>` : ""}
  ${rc ? `<div class="alert warn" data-testid="review-banner"><b>확인 필요 ${rc}건</b> — 근거 문장을 회의록에서 찾지 못했거나 담당·기한이 회의록에 나오지 않는 항목입니다. 원문과 비교한 뒤 ‘원문 확인했어요’를 누르세요.</div>` : ""}
  <h3>중요 안건 ${a.agendas.length}</h3>
  ${a.agendas.length ? a.agendas.map((g, i) => `<div class="agenda">
     <div class="head"><span class="imp ${g.importance}">${IMPORTANCE[g.importance] || "보통"}</span>${esc(cleanLine(g.title))}
       ${norm(g.decision) ? `<span class="badge ok">결정 있음</span>` : ""}</div>
     ${norm(g.details) ? `<ul class="dlist">${detailLines(g.details).map((l) => `<li class="${l.sub ? "sub" : ""}">${esc(l.text)}</li>`).join("")}</ul>` : ""}
     ${evHtml(m, g.evidence)} ${reviewHtml(m, "agenda", g, i)}
     ${norm(g.decision) ? `<div class="decision"><div class="small muted">결정 사항</div><div>${esc(cleanText(g.decision))}</div>${evHtml(m, g.decisionEvidence)} ${reviewHtml(m, "decision", g, i)}</div>`
       : `<div class="small muted" style="margin-top:6px">명시적으로 결정된 사항 없음</div>`}
   </div>`).join("") : `<p class="muted">정리된 안건이 없습니다.</p>`}
  <h3>결정 사항 ${decisions.length}</h3>
  ${decisions.length ? `<ul>${decisions.map(({ g, i }) => `<li><b>${esc(cleanText(g.decision))}</b> <span class="small muted">· ${esc(cleanLine(g.title))}</span> ${reviewOf(m, "decision", g) ? `<span class="badge review">확인 필요</span>` : ""}</li>`).join("")}</ul>` : `<p class="muted">결정 사항이 없습니다.</p>`}
  <h3>후속 조치 ${a.actions.filter((x) => x.done).length}/${a.actions.length}</h3>
  ${a.actions.length ? a.actions.map((x, i) => `<div class="action ${x.done ? "done" : ""}">
      <input type="checkbox" data-done="${i}" ${x.done ? "checked" : ""} aria-label="완료: ${esc(cleanLine(x.task))}">
      <div><div class="task">${esc(cleanLine(x.task))}</div>
        <div class="small">담당 ${norm(x.assignee) ? esc(cleanLine(x.assignee)) : `<span class="unassigned">${UNASSIGNED}</span>`} · 기한 ${norm(x.due) ? esc(cleanLine(x.due)) : `<span class="unassigned">${UNASSIGNED}</span>`}</div>
        ${evHtml(m, x.evidence)} ${reviewHtml(m, "action", x, i)}</div></div>`).join("") : `<p class="muted">후속 조치가 없습니다.</p>`}`;
}

function blankAgenda() { return { title: "", importance: "medium", details: "", evidence: "", decision: "", decisionEvidence: "", confirmed: false, decisionConfirmed: false }; }
function blankAction() { return { task: "", assignee: "", due: "", evidence: "", done: false, confirmed: false }; }
function renderEditor(el, m) {
  const a = m.analysis ? JSON.parse(JSON.stringify(m.analysis)) : { title: "", summary: "", agendas: [blankAgenda()], actions: [] };
  const draw = () => {
    el.innerHTML = `<h2>회의 결과 정리</h2>
    <div class="alert warn small">회의록에 있는 내용만 적으세요. ‘근거 문장’에는 회의록의 문장을 그대로 붙여넣으면 자동으로 확인되고, 찾지 못하면 ‘확인 필요’로 표시됩니다. 담당·기한을 비워 두면 ‘미지정’으로 표시됩니다.</div>
    <label class="f" for="e-title">회의 제목</label><input type="text" id="e-title" maxlength="100" value="${esc(a.title)}">
    <label class="f" for="e-summary">핵심 요약</label><textarea id="e-summary" style="min-height:80px">${esc(a.summary)}</textarea>
    <h3>중요 안건</h3>
    ${a.agendas.map((g, i) => `<div class="edit-item" data-ag="${i}">
      <div class="grid2"><div><label class="f">안건</label><input type="text" data-k="title" value="${esc(g.title)}" maxlength="120"></div>
        <div><label class="f">중요도</label><select data-k="importance">${["high", "medium", "low"].map((v) => `<option value="${v}" ${g.importance === v ? "selected" : ""}>${IMPORTANCE[v]}</option>`).join("")}</select></div></div>
      <label class="f">논의 내용 (한 줄에 하나: "- 내용", 예시는 "  (예, …)")</label><textarea data-k="details" style="min-height:110px">${esc(g.details)}</textarea>
      <label class="f">근거 문장 (회의록에서 복사)</label><input type="text" data-k="evidence" value="${esc(g.evidence)}">
      <label class="f">결정 사항 (없으면 비움)</label><input type="text" data-k="decision" value="${esc(g.decision)}">
      <label class="f">결정 근거 문장</label><input type="text" data-k="decisionEvidence" value="${esc(g.decisionEvidence)}">
      <button class="btn small danger" data-rm-ag="${i}" style="margin-top:8px">안건 삭제</button></div>`).join("")}
    <button class="btn small" id="add-ag">+ 안건 추가</button>
    <h3>후속 조치</h3>
    ${a.actions.map((x, i) => `<div class="edit-item" data-ac="${i}">
      <label class="f">할 일</label><input type="text" data-k="task" value="${esc(x.task)}" maxlength="200">
      <div class="grid2"><div><label class="f">담당 (회의록에 없으면 비움)</label><input type="text" data-k="assignee" value="${esc(x.assignee)}"></div>
        <div><label class="f">기한 (회의록에 없으면 비움)</label><input type="text" data-k="due" value="${esc(x.due)}"></div></div>
      <label class="f">근거 문장</label><input type="text" data-k="evidence" value="${esc(x.evidence)}">
      <button class="btn small danger" data-rm-ac="${i}" style="margin-top:8px">후속 조치 삭제</button></div>`).join("")}
    <button class="btn small" id="add-ac">+ 후속 조치 추가</button>
    <div id="e-msg"></div>
    <div class="row" style="margin-top:16px"><button class="btn primary" id="e-save">결과 저장</button><button class="btn" id="e-cancel">취소</button></div>`;
    const sync = () => {
      a.title = $("#e-title", el).value; a.summary = $("#e-summary", el).value;
      el.querySelectorAll("[data-ag]").forEach((d) => d.querySelectorAll("[data-k]").forEach((f) => (a.agendas[+d.dataset.ag][f.dataset.k] = f.value)));
      el.querySelectorAll("[data-ac]").forEach((d) => d.querySelectorAll("[data-k]").forEach((f) => (a.actions[+d.dataset.ac][f.dataset.k] = f.value)));
    };
    $("#add-ag", el).onclick = () => { sync(); a.agendas.push(blankAgenda()); draw(); };
    $("#add-ac", el).onclick = () => { sync(); a.actions.push(blankAction()); draw(); };
    el.querySelectorAll("[data-rm-ag]").forEach((b) => b.onclick = () => { sync(); a.agendas.splice(+b.dataset.rmAg, 1); draw(); });
    el.querySelectorAll("[data-rm-ac]").forEach((b) => b.onclick = () => { sync(); a.actions.splice(+b.dataset.rmAc, 1); draw(); });
    $("#e-cancel", el).onclick = () => { S.editing = false; render(); };
    $("#e-save", el).onclick = async () => {
      sync();
      const prev = m.analysis;
      const clean = {
        title: cleanLine(a.title), summary: cleanText(a.summary).trim(),
        agendas: a.agendas.filter((g) => norm(g.title)).map((g) => ({ ...g, title: cleanLine(g.title), details: cleanText(g.details).trim(), evidence: cleanText(g.evidence).trim(), decision: cleanText(g.decision).trim(), decisionEvidence: cleanText(g.decisionEvidence).trim() })),
        actions: a.actions.filter((x) => norm(x.task)).map((x) => ({ ...x, task: cleanLine(x.task), assignee: cleanLine(x.assignee), due: cleanLine(x.due), evidence: cleanText(x.evidence).trim() })),
      };
      if (!clean.title && !clean.summary && !clean.agendas.length && !clean.actions.length) { $("#e-msg", el).innerHTML = `<div class="alert err">저장할 내용이 없습니다.</div>`; return; }
      // 근거·담당·기한이 바뀐 항목은 ‘확인했어요’를 다시 받는다
      const same = (p, x, keys) => p && keys.every((k) => norm(p[k]) === norm(x[k]));
      clean.agendas.forEach((g, i) => { const p = prev?.agendas[i]; g.confirmed = !!(p?.confirmed && same(p, g, ["title", "evidence"])); g.decisionConfirmed = !!(p?.decisionConfirmed && same(p, g, ["decision", "decisionEvidence"])); });
      clean.actions.forEach((x, i) => { const p = prev?.actions[i]; x.confirmed = !!(p?.confirmed && same(p, x, ["task", "assignee", "due", "evidence"])); });
      clean.updatedAt = new Date().toISOString(); clean.transcriptHash = hashText(m.transcript.text);
      m.analysis = { ...(prev || {}), ...clean };
      try { await DB.put(m); S.editing = false; S.detailTab = "result"; toast("회의 결과를 저장했습니다."); render(); }
      catch (e) { $("#e-msg", el).innerHTML = `<div class="alert err">저장하지 못했습니다: ${esc(e.message || e)}</div>`; }
    };
  };
  draw();
}

/* ---- 대시보드 ---- */

  </section>

/* ---------------- 보고서 모델 (HWPX·인쇄 공통) ---------------- */
function buildReport(m, now = new Date()) {
  const name = cleanLine(typeName(m.typeId));
  const s = new Date(m.startedAt), e = new Date(m.endedAt), a = m.analysis;
  const info = [["회의 유형", name], ["일시", `${krDate(s)} ${fmtTime(m.startedAt)} – ${fmtTime(m.endedAt)}`], ["녹음 시간", hms(m.durationSec)],
    ["작성일자", `${krDate(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`], ["회의록 작성", transcriptMethod(m.transcript)]];
  const r = { title: `[${name}] 회의록 및 안건 보고서`, info, hasAnalysis: !!a, summary: null, note: null, agendas: [], actions: [], lines: [], foot: [] };
  if (a) {
    if (a.title) info.splice(1, 0, ["회의 제목", cleanLine(a.title)]);
    info.push(["요약 작성", analysisMethod(a)]);
    r.summary = cleanText(a.summary).trim() || null;
    if (isStale(m)) r.note = "결과를 정리한 뒤 회의록이 수정되었습니다. 아래 내용은 수정 전 회의록 기준일 수 있습니다.";
    r.agendas = a.agendas.map((g) => ({ title: cleanLine(g.title), importance: IMPORTANCE[g.importance] || "보통", details: cleanText(g.details).trim() || null,
      decision: cleanText(g.decision).trim() || null, agendaReview: reviewOf(m, "agenda", g), decisionReview: norm(g.decision) ? reviewOf(m, "decision", g) : null }));
    r.actions = a.actions.map((x, i) => { const rv = reviewOf(m, "action", x); return { no: i + 1, task: cleanLine(x.task), assignee: cleanLine(x.assignee) || UNASSIGNED, due: cleanLine(x.due) || UNASSIGNED, status: x.done ? "완료" : "진행", note: rv ? `확인 필요: ${rv}` : "" }; });
  }
  r.lines = cleanText(m.transcript.text).split("\n").map((p) => p.trim()).filter(Boolean);
  if (m.transcript.source === "auto") r.foot.push("녹음 전문은 이 PC에서 실행한 자동 음성 인식 결과로, 받아쓰기·화자 구분 오류가 있을 수 있습니다. ‘화자 N’은 목소리로 나눈 번호입니다.");
  if (a && a.source === "auto") r.foot.push("핵심 요약과 추진 과제는 회의록에서 핵심어를 뽑고 관련 문장을 발췌해 자동 정리한 것으로, 원문과 대조가 필요합니다.");
  r.foot.push("담당·기한의 ‘미지정’은 회의록에서 확인할 수 없었다는 뜻입니다.");
  if (r.agendas.some((g) => g.agendaReview || g.decisionReview) || r.actions.some((x) => x.note)) r.foot.push("[확인 필요] 표시는 근거 문장을 회의록에서 찾지 못했거나 담당·기한이 회의록에 나오지 않는 항목이므로 원문과 대조하세요.");
  return r;
}
function plainText(r) {
  const out = [r.title, ...r.info.map(([k, v]) => `${k}: ${v}`), "1. 핵심 요약 및 결정 사항"];
  if (r.summary) out.push(r.summary);
  r.agendas.forEach((g, i) => { out.push(`${i + 1}) ${g.title}`); if (g.decision) out.push(`결정: ${g.decision}`); });
  out.push("2. 향후 추진 과제", ...r.actions.map((x) => `${x.no}. ${x.task} / ${x.assignee} / ${x.due}`), "3. 회의 녹음 전문", ...r.lines);
  return out.join("\n");
}

function printReport(m) {
  const r = buildReport(m);
  const rv = (t) => (t ? ` <span class="rv">[확인 필요] ${esc(t)}</span>` : "");
  $("#print-area").innerHTML = `<h1>${esc(r.title)}</h1>
    <table>${r.info.map(([k, v]) => `<tr><th style="width:25%">${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</table>
    <h2>1. 핵심 요약 및 결정 사항</h2>
    ${!r.hasAnalysis ? `<p>회의 결과가 정리되지 않았습니다. (안건·결정 사항을 임의로 작성하지 않았습니다.)</p>` : `
      ${r.note ? `<p class="rv">※ ${esc(r.note)}</p>` : ""}<p><b>요약:</b> ${esc(r.summary || "요약 없음")}</p>
      ${r.agendas.map((g, i) => `<p><b>${i + 1}) ${esc(g.title)}</b> (중요도 ${g.importance})${rv(g.agendaReview)}<br>논의: ${esc(g.details || "기록 없음")}<br>결정: ${g.decision ? esc(g.decision) + rv(g.decisionReview) : "명시적으로 결정된 사항 없음"}</p>`).join("") || "<p>정리된 안건이 없습니다.</p>"}`}
    <h2>2. 향후 추진 과제</h2>
    ${!r.hasAnalysis ? "<p>회의 결과가 정리되지 않았습니다.</p>" : r.actions.length ? `<table><tr><th>번호</th><th>과제</th><th>담당</th><th>기한</th><th>상태</th><th>비고</th></tr>${r.actions.map((x) => `<tr><td>${x.no}</td><td>${esc(x.task)}</td><td>${esc(x.assignee)}</td><td>${esc(x.due)}</td><td>${x.status}</td><td class="rv">${esc(x.note)}</td></tr>`).join("")}</table>` : "<p>추진 과제가 없습니다.</p>"}
    <h2>3. 회의 녹음 전문</h2>${r.lines.map((l) => `<p>${esc(l)}</p>`).join("")}
    <p style="color:#555;font-size:9pt">${esc(r.foot.join(" "))}</p>`;
  window.print();
}

/* ---------------- HWPX (OWPML) 생성 ---------------- */
const HX = (() => {
  const NS = 'xmlns:ha="http://www.hancom.co.kr/hwpml/2011/app" xmlns:hp="http://www.hancom.co.kr/hwpml/2011/paragraph" xmlns:hp10="http://www.hancom.co.kr/hwpml/2016/paragraph" xmlns:hs="http://www.hancom.co.kr/hwpml/2011/section" xmlns:hc="http://www.hancom.co.kr/hwpml/2011/core" xmlns:hh="http://www.hancom.co.kr/hwpml/2011/head" xmlns:hhs="http://www.hancom.co.kr/hwpml/2011/history" xmlns:hm="http://www.hancom.co.kr/hwpml/2011/master-page" xmlns:hpf="http://www.hancom.co.kr/schema/2011/hpf" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:opf="http://www.idpf.org/2007/opf/" xmlns:ooxmlchart="http://www.hancom.co.kr/hwpml/2016/ooxmlchart" xmlns:hwpunitchar="http://www.hancom.co.kr/hwpml/2016/HwpUnitChar" xmlns:epub="http://www.idpf.org/2007/ops" xmlns:config="urn:oasis:names:tc:opendocument:xmlns:config:1.0"';
  const DECL = '<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>';
  const LANGS = ["HANGUL", "LATIN", "HANJA", "JAPANESE", "OTHER", "SYMBOL", "USER"];
  const PAGE_W = 59528, PAGE_H = 84186, MLR = 7087, MT = 5668, MB = 4252, TEXT_W = PAGE_W - 2 * MLR;
  const X = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const XA = (s) => X(s).replace(/"/g, "&quot;");
  const CH = { body: [0, 1050, "#000000", 0], title: [1, 1800, "#111827", 1], h1: [2, 1350, "#111827", 1], h2: [3, 1150, "#111827", 1], muted: [4, 950, "#6B7280", 0], review: [5, 950, "#B45309", 1], cell: [6, 1000, "#000000", 0], cellb: [7, 1000, "#111827", 1], label: [8, 1050, "#111827", 1] };
  const PA = { body: [0, "JUSTIFY", 160, 0, 0, 400], title: [1, "CENTER", 150, 0, 0, 1400], h1: [2, "LEFT", 150, 0, 1800, 600], h2: [3, "LEFT", 150, 0, 900, 300], indent: [4, "JUSTIFY", 160, 1600, 0, 300], cell: [5, "LEFT", 130, 0, 0, 0], cellc: [6, "CENTER", 130, 0, 0, 0], bul1: [7, "JUSTIFY", 160, 800, 0, 150], indent2: [8, "JUSTIFY", 160, 2400, 0, 150] };
  const BF_NONE = 1, BF_CELL = 2, BF_HEAD = 3, BF_LABEL = 4;
  const each = (v) => LANGS.map((l) => `${l.toLowerCase()}="${v}"`).join(" ");
  const borderFill = (id, solid, fill) => {
    const t = solid ? "SOLID" : "NONE";
    const side = ["leftBorder", "rightBorder", "topBorder", "bottomBorder"].map((s) => `<hh:${s} type="${t}" width="0.12 mm" color="#000000"/>`).join("");
    const brush = fill ? `<hc:fillBrush><hc:winBrush faceColor="${fill}" hatchColor="#999999" alpha="0"/></hc:fillBrush>` : "";
    return `<hh:borderFill id="${id}" threeD="0" shadow="0" centerLine="NONE" breakCellSeparateLine="0"><hh:slash type="NONE" Crooked="0" isCounter="0"/><hh:backSlash type="NONE" Crooked="0" isCounter="0"/>${side}<hh:diagonal type="SOLID" width="0.1 mm" color="#000000"/>${brush}</hh:borderFill>`;
  };
  const charPr = ([id, h, color, bold]) => `<hh:charPr id="${id}" height="${h}" textColor="${color}" shadeColor="none" useFontSpace="0" useKerning="0" symMark="NONE" borderFillIDRef="${BF_NONE}"><hh:fontRef ${each(0)}/><hh:ratio ${each(100)}/><hh:spacing ${each(0)}/><hh:relSz ${each(100)}/><hh:offset ${each(0)}/>${bold ? "<hh:bold/>" : ""}<hh:underline type="NONE" shape="SOLID" color="#000000"/><hh:strikeout shape="NONE" color="#000000"/><hh:outline type="NONE"/><hh:shadow type="NONE" color="#B2B2B2" offsetX="10" offsetY="10"/></hh:charPr>`;
  const paraPr = ([id, align, line, left, prev, next]) => `<hh:paraPr id="${id}" tabPrIDRef="0" condense="0" fontLineHeight="0" snapToGrid="1" suppressLineNumbers="0" checked="0"><hh:align horizontal="${align}" vertical="BASELINE"/><hh:heading type="NONE" idRef="0" level="0"/><hh:breakSetting breakLatinWord="KEEP_WORD" breakNonLatinWord="KEEP_WORD" widowOrphan="0" keepWithNext="0" keepLines="0" pageBreakBefore="0" lineWrap="BREAK"/><hh:margin><hc:intent value="0" unit="HWPUNIT"/><hc:left value="${left}" unit="HWPUNIT"/><hc:right value="0" unit="HWPUNIT"/><hc:prev value="${prev}" unit="HWPUNIT"/><hc:next value="${next}" unit="HWPUNIT"/></hh:margin><hh:lineSpacing type="PERCENT" value="${line}" unit="HWPUNIT"/><hh:border borderFillIDRef="${BF_NONE}" offsetLeft="0" offsetRight="0" offsetTop="0" offsetBottom="0" connect="0" ignoreMargin="0"/><hh:autoSpacing eAsianEng="0" eAsianNum="0"/></hh:paraPr>`;
  function header() {
    const fonts = LANGS.map((l) => `<hh:fontface lang="${l}" fontCnt="1"><hh:font id="0" face="맑은 고딕" type="TTF" isEmbedded="0"><hh:typeInfo familyType="FCAT_GOTHIC" weight="6" proportion="4" contrast="0" strokeVariation="1" armStyle="1" letterform="1" midline="1" xHeight="1"/></hh:font></hh:fontface>`).join("");
    const fills = [borderFill(BF_NONE, false), borderFill(BF_CELL, true), borderFill(BF_HEAD, true, "#E5E7EB"), borderFill(BF_LABEL, true, "#F3F4F6")];
    const chars = Object.values(CH).sort((a, b) => a[0] - b[0]), paras = Object.values(PA).sort((a, b) => a[0] - b[0]);
    return `${DECL}<hh:head ${NS} version="1.4" secCnt="1"><hh:beginNum page="1" footnote="1" endnote="1" pic="1" tbl="1" equation="1"/><hh:refList><hh:fontfaces itemCnt="${LANGS.length}">${fonts}</hh:fontfaces><hh:borderFills itemCnt="${fills.length}">${fills.join("")}</hh:borderFills><hh:charProperties itemCnt="${chars.length}">${chars.map(charPr).join("")}</hh:charProperties><hh:tabProperties itemCnt="1"><hh:tabPr id="0" autoTabLeft="0" autoTabRight="0"/></hh:tabProperties><hh:paraProperties itemCnt="${paras.length}">${paras.map(paraPr).join("")}</hh:paraProperties><hh:styles itemCnt="1"><hh:style id="0" type="PARA" name="바탕글" engName="Normal" paraPrIDRef="0" charPrIDRef="0" nextStyleIDRef="0" langID="1042" lockForm="0"/></hh:styles></hh:refList><hh:compatibleDocument targetProgram="HWP201X"><hh:layoutCompatibility/></hh:compatibleDocument><hh:docOption><hh:linkinfo path="" pageInherit="0" footnoteInherit="0"/></hh:docOption><hh:trackchageConfig flags="56"/></hh:head>`;
  }
  function section(r, blocks) {
    const parts = []; let pid = 0, tid = 0;
    const run = (t, c) => `<hp:run charPrIDRef="${CH[c][0]}"><hp:t>${X(cleanText(t))}</hp:t></hp:run>`;
    const P = (inner, pa) => `<hp:p id="${++pid}" paraPrIDRef="${PA[pa][0]}" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0">${inner}</hp:p>`;
    const para = (runs, pa = "body") => parts.push(P(runs.filter(([t]) => t).map(([t, c]) => run(t, c)).join("") || `<hp:run charPrIDRef="0"/>`, pa));
    const table = (rows, widths) => {
      tid++; const rh = 1500;
      const trs = rows.map((row, ri) => `<hp:tr>${row.map(([text, kind, bf], ci) => `<hp:tc name="" header="${bf === BF_HEAD ? 1 : 0}" hasMargin="0" protect="0" editable="0" dirty="0" borderFillIDRef="${bf}"><hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="CENTER" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${P(run(text || " ", kind), kind === "cellb" ? "cellc" : "cell")}</hp:subList><hp:cellAddr colAddr="${ci}" rowAddr="${ri}"/><hp:cellSpan colSpan="1" rowSpan="1"/><hp:cellSz width="${widths[ci]}" height="${rh}"/><hp:cellMargin left="510" right="510" top="141" bottom="141"/></hp:tc>`).join("")}</hp:tr>`).join("");
      const sum = widths.reduce((a, b) => a + b, 0);
      const tbl = `<hp:tbl id="${1000 + tid}" zOrder="${tid}" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL" repeatHeader="1" rowCnt="${rows.length}" colCnt="${widths.length}" cellSpacing="0" borderFillIDRef="${BF_CELL}" noAdjust="0"><hp:sz width="${sum}" widthRelTo="ABSOLUTE" height="${rh * rows.length}" heightRelTo="ABSOLUTE" protect="0"/><hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/><hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:inMargin left="510" right="510" top="141" bottom="141"/>${trs}</hp:tbl>`;
      parts.push(P(`<hp:run charPrIDRef="0">${tbl}<hp:t/></hp:run>`, "body"));
    };
    const renderBlocks = (bl) => bl.forEach((b) => {
      if (b.t === "title") para([[b.text, "title"]], "title");
      else if (b.t === "h1") para([[b.text, "h1"]], "h1");
      else if (b.t === "h2") para([[b.text, "h2"], ...(b.note ? [["  " + b.note, "muted"]] : [])], "h2");
      else if (b.t === "p") para(b.runs);
      else if (b.t === "bullet") para([[(b.level === 2 ? "" : "- ") + b.text, b.level === 2 ? "muted" : "body"]], b.level === 2 ? "indent2" : "bul1");
      else if (b.t === "table") {
        const W = b.widths.map((w) => Math.round(TEXT_W * w)); W[W.length - 1] = TEXT_W - W.slice(0, -1).reduce((x, y) => x + y, 0);
        const rows = []; if (b.head) rows.push(b.head.map((h) => [h, "cellb", BF_HEAD]));
        b.rows.forEach((row) => rows.push(row.map((c, ci) => [String(c ?? ""), b.labelCol && ci === 0 ? "label" : c === UNASSIGNED ? "muted" : "cell", b.labelCol && ci === 0 ? BF_LABEL : BF_CELL])));
        table(rows, W);
      }
    });
    if (blocks) renderBlocks(blocks); else {
    para([[r.title, "title"]], "title");
    table(r.info.map(([k, v]) => [[k, "label", BF_LABEL], [v, "cell", BF_CELL]]), [9000, TEXT_W - 9000]);
    para([["1. 핵심 요약 및 결정 사항", "h1"]], "h1");
    if (!r.hasAnalysis) para([["회의 결과가 정리되지 않았습니다. (안건·결정 사항을 임의로 작성하지 않았습니다.)", "muted"]]);
    else {

      para([["요약: ", "label"], [r.summary || "요약 없음", "body"]]);
      if (!r.agendas.length) para([["정리된 안건이 없습니다.", "muted"]]);
      r.agendas.forEach((g, i) => {
        para([[`${i + 1}) ${g.title}`, "h2"], [`  (중요도 ${g.importance})`, "muted"]], "h2");
        if (g.agendaReview) para([[`[확인 필요] ${g.agendaReview}`, "review"]], "indent");
        const dl = detailLines(g.details);
        if (dl.length > 1 || (dl[0] && /^[-•·(]/.test(cleanText(g.details).trim()))) { para([["논의:", "label"]], "indent"); dl.forEach((l) => para([[(l.sub ? "" : "- ") + l.text, l.sub ? "muted" : "body"]], l.sub ? "indent2" : "indent")); }
        else para([["논의: ", "label"], [g.details || "기록 없음", "body"]], "indent");
        if (g.decision) para([["결정: ", "label"], [g.decision, "body"], ...(g.decisionReview ? [[` [확인 필요] ${g.decisionReview}`, "review"]] : [])], "indent");
        else para([["결정: ", "label"], ["명시적으로 결정된 사항 없음", "muted"]], "indent");
      });
    }
