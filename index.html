      let sc = f * idf * (w.includes(" ") ? 1.6 : 1) * (w.replace(/\s/g, "").length >= 3 ? 1.3 : 1) * (/[A-Za-z0-9]/.test(w) && /[가-힣]/.test(w) ? 1.5 : 1);
      if (w.split(" ").every((x) => SUM.GENERIC.has(x))) sc *= 0.45;          // 업무·자료 같은 일반어
      if (/님$/.test(w)) sc *= 0.5;                                           // 과장님 등 호칭은 화제보다 사람

      if (d / N > 0.6 && N > 6) sc *= 0.4;                              // 거의 모든 문장에 나오는 말은 화제로 약함
      scored.push({ w, score: sc, sents: where.get(w) });
    }
    scored.sort((a, b) => b.score - a.score);
    // 두 낱말 묶음이 강하면 그 안의 낱말보다 우선, 같은 문장들을 거의 공유하는 말은 하나만
    const picked = [];
    for (const k of scored) {
      if (picked.some((p) => (p.w.includes(" ") && p.w.split(" ").includes(k.w)) || (k.w.includes(" ") && k.w.split(" ").includes(p.w) && p.score > k.score * 1.5))) continue;
      const dup = picked.find((p) => { const inter = [...k.sents].filter((x) => p.sents.has(x)).length; return inter / Math.min(k.sents.size, p.sents.size) > 0.8; });
      if (dup) { dup.related = dup.related || []; if (dup.related.length < 3) dup.related.push(k.w); continue; }
      picked.push({ ...k });
      if (picked.length >= 12) break;
    }
    return picked;
  },
  /* 개조식으로 다듬기: “~합니다” → “~함”, “~해 주세요” → “~해 줄 것” 등. 뜻은 바꾸지 않는다 */
  concise(s) {
    let t = s.replace(/\s+/g, " ").trim().replace(/[.!]+$/, "");
    const rules = [
      [/(해|하여)\s?주시기\s?바랍니다$/, "$1 줄 것"], [/(해|하여)\s?주세요$/, "$1 줄 것"], [/주세요$/, "줄 것"], [/바랍니다$/, "바람"],
      [/하세요$/, "할 것"], [/하십시오$/, "할 것"], [/합시다$/, "하기로 함"],
      [/했습니다$/, "했음"], [/하였습니다$/, "하였음"], [/겠습니다$/, "겠음"], [/었습니다$/, "었음"], [/았습니다$/, "았음"], [/있습니다$/, "있음"], [/없습니다$/, "없음"], [/습니다$/, "음"],
      [/(이에요|예요|에요)$/, "임"], [/해요$/, "함"], [/돼요$/, "됨"], [/거든요$/, "음"], [/(는데요|인데요)$/, "임"], [/(죠|지요)$/, ""], [/(네요|군요)$/, "음"],
    ];
    for (const [re, rep] of rules) if (re.test(t)) { t = t.replace(re, rep); return t.trim(); }
    // ‘~ㅂ니다’ → ‘~ㅁ’ (합니다→함, 됩니다→됨, 입니다→임)
    const m = t.match(/([가-힣])니다$/);
    if (m) {
      const c = m[1].charCodeAt(0) - 0xac00;
      if (c >= 0 && c % 28 === 17) return t.slice(0, -3) + String.fromCharCode(0xac00 + c - 17 + 16);
    }
    return t;
  },
  find(re, s) { const m = s.match(re); return m ? m[0].trim() : ""; },
  /* 담당: ‘이름+직급’ 또는 부서명. ‘경우 과장님’처럼 이름 자리에 일반 낱말이 오면 버린다 */
  assignee(s) {
    const re = new RegExp(SUM.ASSIGNEE.source, "g");
    for (const m of s.matchAll(re)) {
      const t = m[0].trim(), name = t.split(/\s/)[0];
      const title = /(주무관|주사보|주사|사무관|서기관|팀장|과장|계장|국장|실장|부장|차장|대리|선임|책임|위원|담당|선생)님?$/.test(t) && /\s/.test(t);
      if (title && (SUM.STOP.has(name) || SUM.GENERIC.has(name) || /(의|을|를|은|는|이|가|에|로|와|과|고|서|면|다|요|시|후|전|중|때|우|들)$/.test(name))) continue;
      return t;
    }
    return "";
  },

  /* 전체 정리 */
  run(text, opt = {}) {
    const sents = SUM.sentences(text);
    if (sents.length < 2) throw new Error("회의록 문장이 너무 적어 자동 정리할 수 없습니다(2문장 이상 필요).");
    const kws = SUM.keywords(sents);
    const nTopics = opt.topics || Math.max(2, Math.min(6, Math.round(sents.length / 4)));
    // 문장 중요도: 핵심어 점수 합 + 결정·요청 신호
    const kwScore = new Map(kws.map((k) => [k.w, k.score]));
    sents.forEach((s) => {
      s.ex = SUM.EXAMPLE.test(s.clean); s.dec = !s.ex && SUM.DECISION.test(s.clean); s.req = !s.dec && SUM.REQUEST.test(s.clean);
      s.score = s.nouns.reduce((a, w) => a + (kwScore.get(w) || 0), 0) + (s.dec ? 3 : 0) + (s.req ? 2 : 0);
      kws.forEach((k) => { if (k.w.includes(" ") && s.clean.replace(/\s+/g, " ").includes(k.w)) s.score += k.score; });
    });
    // 화제: 상위 핵심어마다 그 말이 나온 문장을 모은다(한 문장은 가장 강한 화제 하나에만)
    const topics = kws.slice(0, nTopics).map((k) => ({ key: k.w, related: k.related || [], score: k.score, sents: [] }));
    const owner = new Map();
    sents.forEach((s) => {
      let best = null, bv = 0;
      topics.forEach((t) => {
        const has = t.key.includes(" ") ? s.clean.replace(/\s+/g, " ").includes(t.key) || t.key.split(" ").every((w) => s.nouns.includes(w)) : s.nouns.includes(t.key) || t.related.some((r) => s.nouns.includes(r));
        if (has && t.score > bv) { bv = t.score; best = t; }
      });
      if (best) { best.sents.push(s); owner.set(s.i, best); }
    });
    // 예시 문장은 바로 앞 문장과 같은 화제로
    sents.forEach((s, i) => { if (s.ex && i > 0 && owner.has(i - 1) && owner.get(s.i) !== owner.get(i - 1)) { const t = owner.get(s.i); if (t) t.sents = t.sents.filter((x) => x !== s); owner.get(i - 1).sents.push(s); owner.set(s.i, owner.get(i - 1)); } });
    sents.forEach((s, i) => { if (s.ex && i > 0 && owner.has(s.i) && !owner.has(i - 1) && sents[i - 1].line >= s.line - 1) { const t = owner.get(s.i); t.sents.push(sents[i - 1]); owner.set(i - 1, t); } });
    // 화제에 들지 않은 결정·요청 문장은 ‘기타’로
    const extra = sents.filter((s) => !owner.has(s.i) && (s.dec || s.req));
    let list = topics.filter((t) => t.sents.length);
    list.forEach((t) => { t.size = t.sents.length; t.weight = t.sents.reduce((a, s) => a + s.score, 0); });
    list.sort((a, b) => b.weight - a.weight);
    if (extra.length) list.push({ key: "기타 요청·결정", related: [], sents: extra, other: true, size: extra.length, weight: 0 });
    const MAXB = opt.maxBullets || 5;
    const agendas = list.map((t, ti) => {
      // 중요한 문장 순으로 고른 뒤 말한 순서대로
      const chosen = [...t.sents].sort((a, b) => b.score - a.score).slice(0, MAXB);
      // 예시 문장이 골라지면 그 앞 문장도 함께
      chosen.slice().forEach((s) => { if (s.ex) { const p = t.sents.find((x) => x.i === s.i - 1); if (p && !chosen.includes(p)) chosen.push(p); } });
      chosen.sort((a, b) => a.i - b.i);
      const lines = chosen.map((s) => {
        const c = opt.concise === false ? s.clean.replace(/[.]+$/, "") : SUM.concise(s.clean);
        return s.ex ? `  (예, ${c.replace(SUM.EXAMPLE, "")})` : `- ${c}`;
      });
      const dec = chosen.find((s) => s.dec) || t.sents.find((s) => s.dec);
      const rep = chosen.find((s) => !s.ex) || chosen[0];
      const label = t.other ? t.key : t.key + (t.related.length ? ` (${t.related.slice(0, 2).join("·")})` : "");
      return {
        title: label, importance: t.other ? "low" : ti === 0 ? "high" : ti < 3 ? "medium" : "low",
        details: lines.join("\n"), evidence: rep.orig,
        decision: dec ? SUM.concise(dec.clean) : "", decisionEvidence: dec ? dec.orig : "",
        confirmed: false, decisionConfirmed: false, keyword: t.other ? null : t.key, mentions: t.size,
      };
    });
    // 후속 조치: 요청 문장(담당·기한은 그 문장에 나온 표현만)
    const actions = sents.filter((s) => s.req).sort((a, b) => b.score - a.score).slice(0, opt.maxActions || 8).sort((a, b) => a.i - b.i).map((s) => ({
      task: SUM.concise(s.clean.replace(SUM.EXAMPLE, "")), assignee: SUM.assignee(s.clean), due: SUM.find(SUM.DUE, s.clean), evidence: s.orig, done: false, confirmed: false,
    }));
    const top = list.filter((t) => !t.other);
    const kwList = top.map((t) => t.key);
    // 발언 비중(화자가 있으면)
    const spk = new Map(); sents.forEach((s) => { if (s.speaker) spk.set(s.speaker, (spk.get(s.speaker) || 0) + s.clean.length); });
    const totalLen = [...spk.values()].reduce((a, b) => a + b, 0);
    const speakers = [...spk.entries()].sort((a, b) => b[1] - a[1]).map(([n, l]) => ({ name: n, share: Math.round(l / totalLen * 100) }));
    const summary = top.length
      ? `가장 많이 다룬 화제는 ‘${top[0].key}’(관련 문장 ${top[0].size}개)${top.length > 1 ? `이며, 이어서 ${top.slice(1, 4).map((t) => `‘${t.key}’`).join(", ")}을(를) 논의함` : "임"}.` +
        (sents.some((s) => s.dec) ? ` 결정 ${sents.filter((s) => s.dec).length}건` : "") + (actions.length ? `${sents.some((s) => s.dec) ? "," : ""} 요청·후속 조치 ${actions.length}건이 나옴.` : (sents.some((s) => s.dec) ? "이 나옴." : ""))
      : "뚜렷한 핵심어를 찾지 못했습니다. 회의록이 짧거나 화제가 흩어져 있을 수 있습니다.";
    return {
      title: kwList.length ? `주요 화제: ${kwList.slice(0, 3).join(" · ")}` : "회의 결과",
      summary, agendas, actions, keywords: kws.slice(0, 10).map((k) => k.w), speakers,
      source: "auto", method: "키워드 추출·문장 발췌(규칙 기반)", sentenceCount: sents.length,
    };
  },
};

/* 자동 정리 실행 → 회의 결과로 저장 */
async function autoSummarize(m, opt = {}) {
  if (!m.transcript || !norm(m.transcript.text)) throw new Error("회의록이 없습니다. 먼저 자동 전사를 하거나 회의록을 입력하세요.");
  const r = SUM.run(m.transcript.text, opt);
  const now = new Date().toISOString();
  m.analysis = { ...r, preface: m.analysis?.preface || "", updatedAt: now, transcriptHash: hashText(m.transcript.text) };
  m.analysis.autoHash = analysisHash(m.analysis);
  await DB.put(m);
  return m.analysis;
}
function analysisHash(a) { return hashText(JSON.stringify([a.title, a.summary, a.agendas.map((g) => [g.title, g.details, g.decision]), a.actions.map((x) => [x.task, x.assignee, x.due])])); }
function analysisMethod(a) {
  if (!a) return "";
  if (a.source !== "auto") return "직접 작성";
  return `자동 정리(키워드 추출·회의록 문장 발췌)${a.autoHash && a.autoHash !== analysisHash(a) ? " · 사용자 수정" : ""}`;
}

/* ---------------- 결과 정리(브리핑) 문서 블록: HWPX·PDF·텍스트 공통 ---------------- */
function briefingBlocks(m) {
  const a = m.analysis, name = cleanLine(typeName(m.typeId)), s = new Date(m.startedAt);
  const B = [];
  B.push({ t: "title", text: `[${name}] 회의 결과` });
  B.push({ t: "table", labelCol: true, widths: [0.22, 0.78], rows: [
    ["일시", `${krDate(s)} ${fmtTime(m.startedAt).slice(0, 5)} (녹음 ${hms(m.durationSec)})`],
    ...(a.speakers && a.speakers.length > 1 ? [["발언 비중", a.speakers.slice(0, 6).map((x) => `${x.name} ${x.share}%`).join(", ")]] : []),
    ["핵심어", (a.keywords || []).slice(0, 8).map((k) => "#" + k.replace(/\s/g, "")).join(" ") || "-"],
    ["정리 방식", analysisMethod(a)],
  ] });
  if (norm(a.preface)) B.push({ t: "p", runs: [[cleanText(a.preface).trim(), "label"]] });
  if (norm(a.summary)) B.push({ t: "p", runs: [["요약: ", "label"], [cleanText(a.summary).trim(), "body"]] });
  B.push({ t: "h1", text: "주요 안건" });
  if (!a.agendas.length) B.push({ t: "p", runs: [["정리된 안건이 없습니다.", "muted"]] });
  a.agendas.forEach((g, i) => {
    const rv = reviewOf(m, "agenda", g);
    B.push({ t: "h2", text: `${i + 1}. ${cleanLine(g.title)}`, note: g.mentions ? `관련 문장 ${g.mentions}개` : (IMPORTANCE[g.importance] ? `중요도 ${IMPORTANCE[g.importance]}` : "") });
    if (rv) B.push({ t: "p", runs: [[`[확인 필요] ${rv}`, "review"]] });
    detailLines(g.details).forEach((l) => B.push({ t: "bullet", level: l.sub ? 2 : 1, text: l.text }));
    if (norm(g.decision)) B.push({ t: "p", runs: [["→ 결정: ", "label"], [cleanText(g.decision).trim(), "body"], ...(reviewOf(m, "decision", g) ? [[" [확인 필요]", "review"]] : [])] });
  });
  B.push({ t: "h1", text: "후속 조치" });
  if (!a.actions.length) B.push({ t: "p", runs: [["회의록에서 찾은 요청·후속 조치가 없습니다.", "muted"]] });
  else B.push({ t: "table", head: ["번호", "할 일", "담당", "기한", "상태"], widths: [0.07, 0.53, 0.16, 0.14, 0.1],
    rows: a.actions.map((x, i) => [String(i + 1), cleanLine(x.task), cleanLine(x.assignee) || UNASSIGNED, cleanLine(x.due) || UNASSIGNED, x.done ? "완료" : "진행"]) });
  const foot = [];
  if (a.source === "auto") foot.push("회의록에서 핵심어를 뽑고 관련 문장을 발췌·개조식으로 다듬어 자동 정리한 결과입니다. 원문 회의록과 대조한 뒤 활용하세요.");
  foot.push("담당·기한의 ‘미지정’은 회의록에서 확인할 수 없었다는 뜻입니다.");
  B.push({ t: "p", runs: [[foot.join(" "), "muted"]] });
  return B;
}
/* 안건 상세: "- 문장" / "  (예, …)" 줄 → 들여쓰기 수준 */
function detailLines(details) {
  return cleanText(details || "").split("\n").map((l) => l.replace(/\s+$/, "")).filter((l) => norm(l)).map((l) => {
    const sub = /^\s{2,}|^\s*\(예/.test(l);
    return { sub, text: l.trim().replace(/^[-•·]\s*/, "") };
  });
}
function blocksText(B) {
  return B.map((b) => {
    if (b.t === "table") return [b.head, ...b.rows].filter(Boolean).map((r) => r.join(" | ")).join("\n");
    if (b.t === "bullet") return (b.level === 2 ? "    " : " - ") + b.text;
    if (b.t === "p") return b.runs.map((r) => r[0]).join("");
    if (b.t === "h2") return b.text + (b.note ? `  (${b.note})` : "");
    if (b.t === "h1") return "\n■ " + b.text;
    return b.text;
  }).join("\n");
}
/* 메신저에 붙여넣기 좋은 짧은 텍스트 */
function briefingPlain(m) {
  const a = m.analysis, s = new Date(m.startedAt), out = [];
  if (norm(a.preface)) out.push(cleanText(a.preface).trim(), "");
  out.push(`[${cleanLine(typeName(m.typeId))}] 회의 결과 (${krDate(s)} ${fmtTime(m.startedAt).slice(0, 5)})`);
  if ((a.keywords || []).length) out.push("핵심어: " + a.keywords.slice(0, 6).map((k) => "#" + k.replace(/\s/g, "")).join(" "));
  out.push("");
  a.agendas.forEach((g, i) => {
    out.push(`${i + 1}. ${cleanLine(g.title)}`);
    detailLines(g.details).forEach((l) => out.push(l.sub ? `   ${l.text}` : `- ${l.text}`));
    if (norm(g.decision)) out.push(`→ 결정: ${cleanText(g.decision).trim()}`);
    out.push("");
  });
  if (a.actions.length) { out.push("■ 후속 조치"); a.actions.forEach((x) => out.push(`- ${cleanLine(x.task)} (담당 ${cleanLine(x.assignee) || UNASSIGNED}, 기한 ${cleanLine(x.due) || UNASSIGNED})`)); out.push(""); }
  if (a.source === "auto") out.push("※ 회의록에서 자동 정리(발췌)한 내용입니다. 원문과 대조하세요.");
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
}
/* 전체 회의록 보고서 → 블록 (PDF용, HWPX와 같은 구성) */
function reportBlocks(r) {
  const B = [{ t: "title", text: r.title }, { t: "table", labelCol: true, widths: [0.22, 0.78], rows: r.info }, { t: "h1", text: "1. 핵심 요약 및 결정 사항" }];
  if (!r.hasAnalysis) B.push({ t: "p", runs: [["회의 결과가 정리되지 않았습니다. (안건·결정 사항을 임의로 작성하지 않았습니다.)", "muted"]] });
  else {
    if (r.note) B.push({ t: "p", runs: [["※ " + r.note, "review"]] });
    B.push({ t: "p", runs: [["요약: ", "label"], [r.summary || "요약 없음", "body"]] });
    if (!r.agendas.length) B.push({ t: "p", runs: [["정리된 안건이 없습니다.", "muted"]] });
    r.agendas.forEach((g, i) => {
      B.push({ t: "h2", text: `${i + 1}) ${g.title}`, note: `중요도 ${g.importance}` });
      if (g.agendaReview) B.push({ t: "p", runs: [[`[확인 필요] ${g.agendaReview}`, "review"]] });
      const dl = detailLines(g.details);
      if (!dl.length) B.push({ t: "p", runs: [["논의: ", "label"], ["기록 없음", "body"]] });
      else dl.forEach((l) => B.push({ t: "bullet", level: l.sub ? 2 : 1, text: l.text }));
      B.push({ t: "p", runs: g.decision ? [["결정: ", "label"], [g.decision, "body"], ...(g.decisionReview ? [[` [확인 필요] ${g.decisionReview}`, "review"]] : [])] : [["결정: ", "label"], ["명시적으로 결정된 사항 없음", "muted"]] });
    });
  }
  B.push({ t: "h1", text: "2. 향후 추진 과제" });
  if (!r.hasAnalysis) B.push({ t: "p", runs: [["회의 결과가 정리되지 않았습니다.", "muted"]] });
  else if (!r.actions.length) B.push({ t: "p", runs: [["추진 과제가 없습니다.", "muted"]] });
  else B.push({ t: "table", head: ["번호", "과제", "담당", "기한", "상태", "비고"], widths: [0.06, 0.36, 0.16, 0.14, 0.08, 0.2], rows: r.actions.map((x) => [String(x.no), x.task, x.assignee, x.due, x.status, x.note]) });
  B.push({ t: "h1", text: "3. 회의 녹음 전문" });
  r.lines.forEach((l) => B.push({ t: "p", runs: [[l, "body"]] }));
  B.push({ t: "p", runs: [[r.foot.join(" "), "muted"]] });
  return B;
}

/* ---------------- 캔버스 문서 그리기 → PDF (한글은 PC 글꼴로 그려 이미지로 넣음) ---------------- */
const FONT = `"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif`;
function wrapText(ctx, text, maxW) {
  const out = [];
  for (const para of String(text).split("\n")) {
    let line = "";

      <label><span class="small muted">회의</span><select id="b-meeting">${withTx.map((x) => `<option value="${x.id}" ${x.id === m.id ? "selected" : ""}>${esc(typeName(x.typeId))} · ${fmtDate(x.startedAt)} ${fmtTime(x.startedAt).slice(0, 5)}${x.analysis ? " (정리됨)" : ""}</option>`).join("")}</select></label>
      <label><span class="small muted">안건 수</span><select id="b-topics">${[0, 2, 3, 4, 5, 6].map((n) => `<option value="${n}" ${o.topics === n ? "selected" : ""}>${n ? n + "개" : "자동"}</option>`).join("")}</select></label>
      <label class="chk"><input type="checkbox" id="b-concise" ${o.concise ? "checked" : ""}> 개조식으로 다듬기(~함, ~할 것)</label>
    </div>
    <label class="f" for="b-preface">머리말 (선택 — 공유할 때 맨 위에 넣을 문구)</label>
    <input type="text" id="b-preface" maxlength="200" placeholder="예: 과장님 회의 내용 전달입니다. (화~금 해외 출장)" value="${esc(a?.preface || S.pendingPreface || "")}">
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="b-run">${a ? "다시 자동 정리" : "자동 정리"}</button>
      <span id="b-msg"></span>
    </div>
    <div id="b-confirm"></div>
    ${a ? `${briefingHtml(m)}
      <div class="row dl-row">
        <button class="btn primary" id="b-hwpx">한글(HWPX)</button>
        <button class="btn" id="b-png">대시보드 이미지(PNG)</button>
        <button class="btn" id="b-pdf">PDF</button>
        <button class="btn" id="b-copy">텍스트 복사</button>
        <button class="btn" id="b-open">회의 상세에서 고치기</button>
      </div><div id="b-copybox"></div>` : `<div class="empty">아직 정리되지 않았습니다. ‘자동 정리’를 누르세요.</div>`}`;
  const saveO = () => { try { localStorage.setItem("mr-sum", JSON.stringify({ topics: +$("#b-topics", el).value, concise: $("#b-concise", el).checked })); } catch { } };
  $("#b-topics", el).onchange = saveO; $("#b-concise", el).onchange = saveO;
  $("#b-meeting", el).onchange = (e) => { S.briefId = +e.target.value; render(); };
  const pf = $("#b-preface", el);
  pf.onchange = async () => {
    const v = cleanLine(pf.value);
    if (m.analysis) { m.analysis.preface = v; await DB.put(m); render(); } else S.pendingPreface = v;
  };
  const run = async () => {
    const msg = $("#b-msg", el);
    try {
      if (!m.analysis) m.analysis = null;
      const pre = cleanLine(pf.value);
      await autoSummarize(m, { topics: +$("#b-topics", el).value || null, concise: $("#b-concise", el).checked });
      m.analysis.preface = pre; m.analysis.autoHash = analysisHash(m.analysis); await DB.put(m);
      S.pendingPreface = "";
      toast("회의 결과를 자동 정리했습니다."); render();
    } catch (e) { msg.innerHTML = `<span class="alert err" style="display:inline-block;margin:0">${esc(e.message || e)}</span>`; }
  };
  $("#b-run", el).onclick = () => {
    const edited = a && (a.source !== "auto" || (a.autoHash && a.autoHash !== analysisHash(a)));
    if (edited) {
      $("#b-confirm", el).innerHTML = `<div class="alert warn">이 회의에는 ${a.source !== "auto" ? "직접 작성한" : "고친"} 회의 결과가 있습니다. 다시 자동 정리하면 그 내용이 바뀝니다.
        <div class="row" style="margin-top:8px"><button class="btn primary" id="b-go">다시 정리</button><button class="btn" id="b-no">취소</button></div></div>`;
      $("#b-go", el).onclick = run; $("#b-no", el).onclick = () => ($("#b-confirm", el).innerHTML = "");
    } else run();
  };
  if (!a) return;
  const guard = (fn) => async () => { try { await fn(m); toast("내려받았습니다."); } catch (e) { toast("만들지 못했습니다: " + (e.message || e)); } };
  $("#b-hwpx", el).onclick = guard(downloadBriefingHwpx);
  $("#b-png", el).onclick = guard(downloadBriefingPng);
  $("#b-pdf", el).onclick = guard(downloadBriefingPdf);
  $("#b-open", el).onclick = () => { S.tab = "meetings"; S.detailId = m.id; S.detailTab = "result"; S.editing = false; render(); };
  $("#b-copy", el).onclick = async () => {
    const t = briefingPlain(m);
    try { await navigator.clipboard.writeText(t); toast("텍스트를 복사했습니다. 메신저에 붙여넣으세요."); }
    catch {
      $("#b-copybox", el).innerHTML = `<p class="small muted">자동 복사가 막혀 있습니다. 아래 글을 선택해 복사(Ctrl+C)하세요.</p><textarea readonly style="min-height:200px">${esc(t)}</textarea>`;
      const ta = $("#b-copybox textarea", el); ta.focus(); ta.select();
    }
  };
}

/* ---------------- 시작 ---------------- */
document.querySelectorAll("nav.tabs button").forEach((b) => b.onclick = () => {
  S.tab = b.dataset.tab; S.detailId = null; S.editing = false; S.highlight = null;
  if (R.state === "saved" || R.state === "error") { R.state = "idle"; R.error = null; }
  render();
});
(async () => {
  try {
    await DB.open();
    const saved = await DB.getSetting("types");
    if (Array.isArray(saved) && saved.length === 5) S.types = saved.map((t, i) => ({ id: i + 1, name: cleanLine(t.name) || `회의 종류 ${i + 1}` }));
  } catch (e) { S.dbError = e?.message || String(e); }
  render();
})();
</script>
</body>
</html>
